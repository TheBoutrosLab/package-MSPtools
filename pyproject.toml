[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
license = "BSD-3-Clause"
license-files = ["LICENSE"]
name = "msptools"
requires-python = ">=3.10,<3.12"
authors = [
    {name = 'Chenghao Zhu'},
    {name = 'Lydia Y. Liu'}
]
description = 'Command line toolkit for mass spectrometry based proteomics data processing and analysis.'
classifiers = [
    # Add or remove any appropriate classifiers
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: BSD License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development :: Libraries",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Development Status :: 4 - Beta",
    "Natural Language :: English"
]

dependencies = [
    "biopython>=1.80,<=1.83",
    "numpy>=1.26,<2",
    "pyopenms==3.2.0",
    "mopepgen==1.4.2",
]

dynamic = ["version"]
readme = {file = "README.md", content-type = "text/markdown"}

[project.scripts]
msptools = "msptools.cli.__main__:main"

[project.urls]
"Homepage" = "https://github.com/TheBoutrosLab/package-MSPtools"
"Bug Tracker" = "https://github.com/TheBoutrosLab/package-MSPtools/issues"
"Repository" = "https://github.com/TheBoutrosLab/package-MSPtools.git"
"Changelog" = "https://github.com/TheBoutrosLab/package-MSPtools/blob/main/CHANGELOG.md"

[tool.hatch.version]
path = "msptools/__init__.py"

[project.optional-dependencies]
dev-dependencies = [
    "pytest>=8,<10",
    "pytest-cov>=7.1.0,<8",
]

[tool.pyright]
pythonVersion = "3.10"

include = [
    "*.py",
    "msptools/",
    "test/"
]

exclude = [
    "**/build",
    "**/dist",
    "**/.venv",
    "**/.pytest_cache",
    ".github",
    ".git",
    "**/typings",
    "**/node_modules",
    "**/__pycache__"
]

extraPaths = []

stubPath = "./typings"

useLibraryCodeForTypes = true

typeCheckingMode = "strict"

reportImportCycles = "information"
reportCallInDefaultInitializer = "warning"
reportImplicitOverride = "information"
reportImplicitStringConcatenation = "warning"
reportMissingSuperCall = "information"
reportPropertyTypeMismatch = "error"
reportShadowedImports = "information"
reportUninitializedInstanceVariable = "information"
reportUnnecessaryTypeIgnoreComment = "information"
reportUnusedCallResult = "information"
reportMissingTypeStubs = "information"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = [
    "test"
]

addopts = [
    "--import-mode=importlib",
    # to debug tests without altering these options see
    # https://pytest-cov.readthedocs.io/en/latest/debuggers.html
    # For more information regarding doing this with VSCode see
    # https://github.com/microsoft/vscode-python/issues/21255
    # and
    # https://github.com/microsoft/vscode-python/issues/21845
    "--cov=.",
    "--junitxml=pytest.xml",
    "-o=junit_family=xunit2",
    "--cov-report=xml:cov.xml"
]

python_files = "test_*.py"

norecursedirs = "__pycache__ build dist .pytest_cache *.egg-info .venv"

[tool.coverage.report]
include_namespace_packages = true

[tool.coverage.run]
relative_files = true
omit = [
    ".venv/*",
    ".github-venv/*",
    "*/test/*",
    "build/*",
    "*/build/*",
    ".pytest_cache/*",
    ".github/*",
    ".git/*",
    "typings/*",
    "*/typings/*",
    "node_modules/*",
    "__pycache__/*",
    "*/__pycache__/*"
]

[tool.black]
exclude = "./(typings|build|dist)"

[tool.isort]
profile = "black"
src_paths = ["msptools"]
skip_glob = ["typings", "build", "dist"]

[tool.tox]
legacy_tox_ini = """
[tox]
env_list =
    py3.10

[testenv]
deps =
    pytest
    pytest-cov
commands = pytest test --junitxml=junit/test-results.xml
"""
