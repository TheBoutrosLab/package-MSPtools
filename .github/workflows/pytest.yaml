---
name: Run PyTest

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"
      - name: Install package and test dependencies
        run: python -m pip install -e ".[dev-dependencies]"
      - name: Run tests
        run: python -m pytest test --junitxml=junit/test-results.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pytest-results
          path: junit/test-results.xml
          if-no-files-found: warn
